<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#171717" />
    <meta
      name="description"
      content="Your personal drawing studio. Brushes, layers, and ideas, wherever you are."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>DrawSketch — Drawing studio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <svg

      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >

        <symbol id="i-eraser" viewBox="0 0 24 24">

        <symbol id="i-dropper" viewBox="0 0 24 24">

        <symbol id="i-fill" viewBox="0 0 24 24">

        <symbol id="i-hand" viewBox="0 0 24 24">

            d="M8 12V5a2 2 0 0 1 4 0v7-9a2 2 0 0 1 4 0v9-6a2 2 0 0 1 4 0v10c0 5-3 7-7 7h-1c-3 0-4-2-6-5l-3-4a2 2 0 0 1 3-3l2 2"

        <symbol id="i-undo" viewBox="0 0 24 24">

        </symbol>

        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
        <symbol id="i-download" viewBox="0 0 24 24">

        <symbol id="i-image" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="3" />
          <circle cx="8" cy="8" r="2" />
          <path d="m3 17 5-5 4 4 4-6 5 7" />
        </symbol>
        <symbol id="i-folder" viewBox="0 0 24 24">
          <path d="M3 8V5h7l2 3h9v13H3V8ZM3 11h18" />
        </symbol>
        <symbol id="i-save" viewBox="0 0 24 24">
          <path d="M3 3h15l3 3v15H3V3ZM7 3v7h10V3M7 21v-7h10v7" />
        </symbol>
        <symbol id="i-eye" viewBox="0 0 24 24">
          <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z" />
          <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="i-eye-off" viewBox="0 0 24 24">
          <path
            d="m3 3 18 18M10 5h2c6 0 10 7 10 7a21 21 0 0 1-4 4M6 6a22 22 0 0 0-4 6s4 7 10 7c2 0 3 0 5-1"
          />
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
          <path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7" />
        </symbol>
        <symbol id="i-copy" viewBox="0 0 24 24">
          <rect x="8" y="8" width="13" height="13" rx="2" />
          <path d="M16 8V3H3v13h5" />
        </symbol>
        <symbol id="i-up" viewBox="0 0 24 24">
          <path d="m6 14 6-6 6 6" />
        </symbol>
        <symbol id="i-down" viewBox="0 0 24 24">
          <path d="m6 10 6 6 6-6" />
        </symbol>
        <symbol id="i-fit" viewBox="0 0 24 24">
          <path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5" />
          <rect x="7" y="7" width="10" height="10" rx="1" />
        </symbol>
        <symbol id="i-grid" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M9 3v18M15 3v18M3 9h18M3 15h18" />
        </symbol>
        <symbol id="i-help" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 5M12 17h.01" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="m5 12 4 4L19 6" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
          <path d="m6 6 12 12M6 18 18 6" />
        </symbol>
        <symbol id="i-layers" viewBox="0 0 24 24">
          <path d="m12 3 10 5-10 5L2 8l10-5ZM2 12l10 5 10-5M2 16l10 5 10-5" />
        </symbol>
        <symbol id="i-settings" viewBox="0 0 24 24">
          <path
            d="m10 3-.7 3-2 .9-2.8-.9-2 3.4 2.2 2v2.4l-2.2 2 2 3.4 2.8-.9 2 .9.7 3h4l.7-3 2-.9 2.8.9 2-3.4-2.2-2v-2.4l2.2-2-2-3.4-2.8.9-2-.9-.7-3Z"
          />
          <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="i-mirror" viewBox="0 0 24 24">
          <path d="M12 3v18M8 6 3 18h5V6ZM16 6l5 12h-5V6Z" />
        </symbol>
        <symbol id="i-expand" viewBox="0 0 24 24">
          <path
            d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5M3 3l5 5M21 3l-5 5M3 21l5-5M21 21l-5-5"
          />
        </symbol>
        <symbol id="i-lock" viewBox="0 0 24 24">
          <rect x="5" y="10" width="14" height="11" rx="2" />
          <path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3" />
        </symbol>
        <symbol id="i-merge" viewBox="0 0 24 24">
          <path
            d="M6 3v4c0 4 6 3 6 8V3M12 21l-4-4M12 21l4-4M18 3v4c0 4-6 3-6 8"
          />
        </symbol>
        <symbol id="i-rename" viewBox="0 0 24 24">
          <path d="M4 7h7M4 12h5M4 17h5m6-13 5 5-9 9-5 1 1-5 8-10Z" />
        </symbol>
        <symbol id="i-spark" viewBox="0 0 24 24">
          <path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7Z" />
        </symbol>
        <symbol id="i-rotate" viewBox="0 0 24 24">
          <path d="M4 10a8 8 0 1 1 1 7M4 4v6h6" />
        </symbol>
        <symbol id="i-book" viewBox="0 0 24 24">
          <rect x="5" y="3" width="16" height="18" rx="2" />
          <path d="M9 3v18M2 7h5M2 12h5M2 17h5M13 8h4M13 12h4" />
        </symbol>
        <symbol id="i-select" viewBox="0 0 24 24">
          <path
            d="M3 7V3h4m10 0h4v4M3 17v4h4m10 0h4v-4M3 11v2m18-2v2M11 3h2m-2 18h2"
          />
        </symbol>
        <symbol id="i-lasso" viewBox="0 0 24 24">
          <path
            d="M9 18c-10-3-8-14 4-14s14 14 0 14H9Zm0 0c-3 1-4 5-1 5s4-4 1-5Z"
          />
        </symbol>
        <symbol id="i-move" viewBox="0 0 24 24">
          <path
            d="M12 2v20M2 12h20M8 6l4-4 4 4M8 18l4 4 4-4M6 8l-4 4 4 4M18 8l4 4-4 4"
          />
        </symbol>
      </defs>
    </svg>
    <header class="app-header">
      <a class="brand" href="./" data-i18n-aria-label="home"
        ><span class="brand-mark"
          ><svg aria-hidden="true"><use href="#i-pen" /></svg></span
        ><span class="brand-word"
          >draw<span>sketch</span><small data-i18n="studio"></small></span
      ></a>
      <div class="document-heading">
        <input
          id="document-name"
          data-i18n-aria-label="documentName"
          maxlength="80"
        /><span id="save-status" role="status"></span>
      </div>
      <nav class="document-actions" data-i18n-aria-label="file">
        <button
          id="new-document"
          class="button new-button"
          data-i18n-title="new"
        >
          <svg aria-hidden="true"><use href="#i-plus" /></svg
          ><span data-i18n="new" class=""></span></button
        ><button
          id="gallery-button"
          class="icon-button"
          data-i18n-title="gallery"
          data-i18n-aria-label="gallery"
        >
          <svg aria-hidden="true"><use href="#i-book" /></svg></button
        ><button
          id="open-project"
          class="icon-button"
          data-i18n-title="open"
          data-i18n-aria-label="open"
        >
          <svg aria-hidden="true"><use href="#i-folder" /></svg></button
        ><button
          id="save-project"
          class="icon-button"
          data-i18n-title="save"
          data-i18n-aria-label="save"
        >
          <svg aria-hidden="true"><use href="#i-save" /></svg></button
        ><button
          id="settings-button"
          class="icon-button"
          data-i18n-title="settings"
          data-i18n-aria-label="settings"
        >
          <svg aria-hidden="true"><use href="#i-settings" /></svg></button
        ><span class="separator"></span
        ><button
          id="export-image"
          class="button primary"
          data-i18n-title="export"
        >
          <svg aria-hidden="true"><use href="#i-download" /></svg
          ><span data-i18n="export" class=""></span>
        </button>
      </nav>
    </header>
    <div class="workspace">
      <aside class="brush-panel" data-i18n-aria-label="brushes">
        <div class="panel-heading">
          <h2 data-i18n="brushes" class=""></h2>
          <span data-i18n="brushCount" class="small-label"></span>
        </div>
        <p data-i18n="brushIntro" class="panel-intro"></p>
        <div id="brush-presets" class="brush-presets">
          <button
            class="brush-preset selected"
            data-brush="pencil"
            aria-pressed="true"
          >
            <span class="brush-art pencil"
              ><svg aria-hidden="true"><use href="#i-pen" /></svg></span
            ><span class="brush-description"
              ><strong data-i18n="pencil"></strong
              ><small data-i18n="pencilDesc"></small></span
            ><span class="preset-check"
              ><svg aria-hidden="true"><use href="#i-check" /></svg
            ></span></button
          ><button class="brush-preset" data-brush="ink" aria-pressed="false">
            <span class="brush-art ink"
              ><svg aria-hidden="true"><use href="#i-pen" /></svg></span
            ><span class="brush-description"
              ><strong data-i18n="ink"></strong
              ><small data-i18n="inkDesc"></small></span
            ><span class="preset-check"
              ><svg aria-hidden="true"><use href="#i-check" /></svg
            ></span></button
          ><button
            class="brush-preset"
            data-brush="marker"
            aria-pressed="false"
          >
            <span class="brush-art marker"
              ><svg aria-hidden="true"><use href="#i-brush" /></svg></span
            ><span class="brush-description"
              ><strong data-i18n="marker"></strong
              ><small data-i18n="markerDesc"></small></span
            ><span class="preset-check"
              ><svg aria-hidden="true"><use href="#i-check" /></svg
            ></span></button
          ><button
            class="brush-preset"
            data-brush="watercolor"
            aria-pressed="false"
          >
            <span class="brush-art watercolor"
              ><svg aria-hidden="true"><use href="#i-brush" /></svg></span
            ><span class="brush-description"
              ><strong data-i18n="watercolor"></strong
              ><small data-i18n="watercolorDesc"></small></span
            ><span class="preset-check"
              ><svg aria-hidden="true"><use href="#i-check" /></svg
            ></span></button
          ><button
            class="brush-preset"
            data-brush="airbrush"
            aria-pressed="false"
          >
            <span class="brush-art airbrush"
              ><svg aria-hidden="true"><use href="#i-spark" /></svg></span
            ><span class="brush-description"
              ><strong data-i18n="airbrush"></strong
              ><small data-i18n="airbrushDesc"></small></span
            ><span class="preset-check"
              ><svg aria-hidden="true"><use href="#i-check" /></svg
            ></span></button
          ><button
            class="brush-preset"
            data-brush="charcoal"
            aria-pressed="false"
          >
            <span class="brush-art charcoal"
              ><svg aria-hidden="true"><use href="#i-pen" /></svg></span
            ><span class="brush-description"
              ><strong data-i18n="charcoal"></strong
              ><small data-i18n="charcoalDesc"></small></span
            ><span class="preset-check"
              ><svg aria-hidden="true"><use href="#i-check" /></svg
            ></span></button
          ><button class="brush-preset" data-brush="oil" aria-pressed="false">
            <span class="brush-art oil"
              ><svg aria-hidden="true"><use href="#i-brush" /></svg></span
            ><span class="brush-description"
              ><strong data-i18n="oil"></strong
              ><small data-i18n="oilDesc"></small></span
            ><span class="preset-check"
              ><svg aria-hidden="true"><use href="#i-check" /></svg
            ></span></button
          ><button class="brush-preset" data-brush="pixel" aria-pressed="false">
            <span class="brush-art pixel"
              ><svg aria-hidden="true"><use href="#i-rect" /></svg></span
            ><span class="brush-description"
              ><strong data-i18n="pixel"></strong
              ><small data-i18n="pixelDesc"></small></span
            ><span class="preset-check"
              ><svg aria-hidden="true"><use href="#i-check" /></svg
            ></span>
          </button>
        </div>
        <div class="brush-settings">
          <div data-i18n="brushSettings" class="section-label"></div>
          <label class="range-label" for="brush-size"
            ><span data-i18n="size" class=""></span
            ><output id="size-value"></output></label
          ><input
            id="brush-size"
            type="range"
            min="1"
            max="160"
            value="4"
          /><label class="range-label" for="brush-opacity"
            ><span data-i18n="opacity" class=""></span
            ><output id="opacity-value"></output></label
          ><input
            id="brush-opacity"
            type="range"
            min="1"
            max="100"
            value="85"
          /><label class="range-label" for="stabilization"
            ><span data-i18n="stabilization" class=""></span
            ><output id="stabilization-value"></output></label
          ><input id="stabilization" type="range" min="0" max="80" value="0" />
          <div class="brush-preview">
            <canvas id="brush-preview" width="240" height="75"></canvas
            ><span data-i18n="preview" class=""></span>
          </div>
        </div>
        <div class="studio-note">
          <svg aria-hidden="true"><use href="#i-spark" /></svg>
          <p data-i18n="tagline" class=""></p>
        </div>
      </aside>
      <main class="drawing-area">
        <div class="tool-options">
          <button
            id="choose-brush"
            class="active-tool-label"
            data-i18n-title="brushChoose"
          >
            <span class="live-indicator"></span
            ><strong id="active-tool-name"></strong
            ><span class="chevron">⌄</span></button
          ><span class="toolbar-separator"></span
          ><label class="symmetry-control"
            ><svg aria-hidden="true"><use href="#i-mirror" /></svg
            ><select id="symmetry" data-i18n-aria-label="symmetry">
              <option value="off" data-i18n="off"></option>
              <option value="vertical" data-i18n="vertical"></option>
              <option value="horizontal" data-i18n="horizontal"></option>
              <option value="both" data-i18n="both"></option></select></label
          ><button
            id="shape-fill"
            class="icon-button"
            data-i18n-title="shapeFill"
            data-i18n-aria-label="shapeFill"
            aria-pressed="false"
          >
            <svg aria-hidden="true"><use href="#i-fill" /></svg></button
          ><span id="tool-hint" class="tool-hint"></span>
          <div class="history-actions">
            <button
              id="references-open"
              class="icon-button"
              data-i18n-title="references"
              data-i18n-aria-label="references"
              aria-controls="reference-panel"
              aria-expanded="false"
            >
              <svg aria-hidden="true"><use href="#i-image" /></svg>
            </button>
            <button
              id="timelapse-open"
              class="icon-button"
              data-i18n-title="timelapse"
              data-i18n-aria-label="timelapse"
            >
              <svg aria-hidden="true"><use href="#i-clock" /></svg>
            </button>
            <button
              id="undo"
              class="icon-button"
              data-i18n-title="undoTip"
              data-i18n-aria-label="undoTip"
              disabled
            >
              <svg aria-hidden="true"><use href="#i-undo" /></svg></button
            ><button
              id="redo"
              class="icon-button"
              data-i18n-title="redoTip"
              data-i18n-aria-label="redoTip"
              disabled
            >
              <svg aria-hidden="true"><use href="#i-redo" /></svg></button
            ><span class="separator"></span
            ><button
              id="import-image"
              class="icon-button"
              data-i18n-title="importImage"
              data-i18n-aria-label="importImage"
            >
              <svg aria-hidden="true"><use href="#i-image" /></svg></button
            ><button
              id="toggle-grid"
              class="icon-button"
              data-i18n-title="grid"
              data-i18n-aria-label="grid"
              aria-pressed="false"
            >
              <svg aria-hidden="true"><use href="#i-grid" /></svg></button
            ><button
              id="focus-button"
              class="icon-button"
              data-i18n-title="focus"
              data-i18n-aria-label="focus"
              aria-pressed="false"
            >
              <svg aria-hidden="true"><use href="#i-expand" /></svg></button
            ><button
              id="toggle-properties"
              class="icon-button mobile-properties-button"
              data-i18n-title="properties"
              data-i18n-aria-label="properties"
              aria-controls="properties-panel"
              aria-expanded="false"
            >
              <svg aria-hidden="true"><use href="#i-layers" /></svg>
            </button>
          </div>
        </div>
        <div
          id="quick-actions"
          class="quick-actions"
          role="toolbar"
          data-i18n-aria-label="quickActions"
        ></div>
        <div id="canvas-viewport" class="canvas-viewport">
          <div class="canvas-caption">
            <span class="caption-line"></span><span id="canvas-caption"></span
            ><span class="caption-line"></span>
          </div>
          <div class="tool-palette" role="toolbar" data-i18n-aria-label="tools">
            <button
              data-tool="select"
              class="tool-button"
              data-i18n-title="selectTip"
              data-i18n-aria-label="select"
              aria-pressed="false"
            >
              <svg aria-hidden="true"><use href="#i-select" /></svg></button
            ><button
              data-tool="lasso"
              class="tool-button"
              data-i18n-title="lassoTip"
              data-i18n-aria-label="lasso"
              aria-pressed="false"
            >
              <svg aria-hidden="true"><use href="#i-lasso" /></svg></button
            ><button
              data-tool="move"
              class="tool-button"
              data-i18n-title="moveTip"
              data-i18n-aria-label="move"
              aria-pressed="false"
            >
              <svg aria-hidden="true"><use href="#i-move" /></svg></button
            ><button
              data-tool="brush"
              class="tool-button active"
              data-i18n-title="brushTip"
              data-i18n-aria-label="brush"
              aria-pressed="true"
            >
              <svg aria-hidden="true"><use href="#i-brush" /></svg></button
            ><button
              data-tool="eraser"
              class="tool-button"
              data-i18n-title="eraserTip"
              data-i18n-aria-label="eraser"
              aria-pressed="false"
            >
              <svg aria-hidden="true"><use href="#i-eraser" /></svg></button
            ><button
              data-tool="fill"
              class="tool-button"
              data-i18n-title="fillTip"
              data-i18n-aria-label="fill"
              aria-pressed="false"
            >
              <svg aria-hidden="true"><use href="#i-fill" /></svg></button
            ><button
              data-tool="eyedropper"
              class="tool-button"
              data-i18n-title="eyedropperTip"
              data-i18n-aria-label="eyedropper"
              aria-pressed="false"
            >
              <svg aria-hidden="true"><use href="#i-dropper" /></svg></button
            ><span class="palette-divider"></span
            ><button
              data-tool="line"
              class="tool-button"
              data-i18n-title="lineTip"
              data-i18n-aria-label="line"
              aria-pressed="false"
            >
              <svg aria-hidden="true"><use href="#i-line" /></svg></button
            ><button
              data-tool="rectangle"
              class="tool-button"
              data-i18n-title="rectangleTip"
              data-i18n-aria-label="rectangle"
              aria-pressed="false"

            class="button close-dialog"
            data-i18n="cancel"
          ></button
          ><button
            type="submit"
            class="button primary"
            data-i18n="renameSave"
          ></button>
        </div>
      </form>
    </dialog>
    <dialog id="transform-dialog" class="transform-dialog">
      <div class="dialog-heading">
        <h2 data-i18n="transformHeading"></h2>
        <button class="icon-button close-dialog" data-i18n-aria-label="close">
          <svg aria-hidden="true"><use href="#i-close" /></svg>
        </button>
      </div>
      <div class="transform-fields">
        <label class="form-label"
          ><span data-i18n="positionX"></span
          ><input id="transform-x" type="number" /></label
        ><label class="form-label"
          ><span data-i18n="positionY"></span
          ><input id="transform-y" type="number" /></label
        ><label class="form-label"
          ><span data-i18n="transformWidth"></span
          ><input id="transform-width" type="number" /></label
        ><label class="form-label"
          ><span data-i18n="transformHeight"></span
          ><input id="transform-height" type="number" /></label
        ><label class="form-label"
          ><span data-i18n="angle"></span
          ><input id="transform-angle" type="number"
        /></label>
      </div>
      <label class="check-row"
        ><input id="transform-flip-x" type="checkbox" /><span
          data-i18n="flipX"
        ></span></label
      ><label class="check-row"
        ><input id="transform-flip-y" type="checkbox" /><span
          data-i18n="flipY"
        ></span></label
      ><button
        id="transform-apply"
        class="button"
        data-i18n="applyTransform"
      ></button
      ><button
        id="transform-cancel"
        class="button"
        data-i18n="cancelTransform"
      ></button>
    </dialog>
    <dialog id="versions-dialog" class="gallery-dialog">
      <div class="dialog-heading">
        <h2 data-i18n="versionsHeading"></h2>
        <button class="icon-button close-dialog" data-i18n-aria-label="close">
          <svg aria-hidden="true"><use href="#i-close" /></svg>
        </button>
      </div>
      <p data-i18n="versionHint"></p>
      <button
        id="checkpoint-now"
        class="button"
        data-i18n="checkpoint"
      ></button>
      <div id="version-list" class="version-list"></div>
    </dialog>
    <input
      type="file"
      id="backup-file"
      accept=".drawsketch-backup,application/json"
      hidden
    />
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
