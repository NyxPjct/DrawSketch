name: Native packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:pack
      - if: runner.os == 'Linux'
        run: DRAWSKETCH_DESKTOP_EXECUTABLE=release/linux-unpacked/drawsketch npm run test:native
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip

  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare verified Android SDK and JDK
        shell: bash
        env:
          DRAWSKETCH_NATIVE_CACHE: ${{ runner.temp }}/drawsketch-native
        run: python3 scripts/setup-android.py 2>&1 | tee "$RUNNER_TEMP/android-sdk-setup.log"
      - name: Build test APK
        shell: bash
        env:
          DRAWSKETCH_NATIVE_CACHE: ${{ runner.temp }}/drawsketch-native
        run: npm run mobile:android 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Report Android build diagnostics
        if: failure()
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          for path in [root/'android-sdk-setup.log', root/'drawsketch-native/sdk-install.log', root/'android-build.log']:
              if path.is_file():
                  detail = path.read_text(errors='replace')[-4500:]
                  detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=Android {path.name}::{detail}')
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apk
          path: release/*.apk
          if-no-files-found: error

  ios:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mobile:ios
      - run: ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app release/DrawSketch-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: release/DrawSketch-ios-simulator.zip
          if-no-files-found: error

  release:
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.validate.result == 'success'
    needs: [validate, desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create package checksums
        working-directory: packages
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            DrawSketch drawing studio. Only successfully built packages are attached; check the workflow for each platform result.
            Desktop packages are unsigned test builds. The Android APK uses debug signing and is for testing.
            The iOS archive runs in the Xcode simulator; installing on a physical iPhone/iPad requires Apple signing and provisioning.
            Hardware stylus and palm-rejection certification remains pending; see docs/NATIVE.md.
