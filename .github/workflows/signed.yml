name: Signed distribution (publisher credentials required)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string
      target:
        description: Signing target
        required: true
        type: choice
        options: [desktop, android, ios]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG) || process.env.RELEASE_TAG !== `v${version}`) throw new Error('Select a matching release version tag');
          JS
      - run: npm ci
      - run: npm test
  desktop:
    needs: validate
    if: inputs.target == 'desktop'
    environment: signed-distribution
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          if (!process.env.API_KEY) throw new Error('Configure APPLE_API_KEY_BASE64 in the signed-distribution environment');
          const file = path.join(process.env.RUNNER_TEMP, 'notarization.p8');
          fs.writeFileSync(file, Buffer.from(process.env.API_KEY, 'base64'), {mode: 0o600});
          fs.appendFileSync(process.env.GITHUB_ENV, `APPLE_API_KEY=${file}\n`);
          JS
      - name: Build with publisher signature
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_BASE64 || secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.MAC_SIGNING_IDENTITY }}
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run desktop:signed
      - uses: actions/upload-artifact@v4
        with:
          name: signed-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap

  android:
    needs: validate
    if: inputs.target == 'android'
    environment: signed-distribution
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DRAWSKETCH_NATIVE_CACHE: ${{ runner.temp }}/drawsketch-native
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 scripts/setup-android.py
      - name: Prepare publisher keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          if (!process.env.KEYSTORE) throw new Error('Configure ANDROID_KEYSTORE_BASE64 in the signed-distribution environment');
          const file = path.join(process.env.RUNNER_TEMP, 'publisher.jks');
          fs.writeFileSync(file, Buffer.from(process.env.KEYSTORE, 'base64'), {mode: 0o600});
          fs.appendFileSync(process.env.GITHUB_ENV, `DRAWSKETCH_ANDROID_KEYSTORE=${file}\n`);
          JS
      - run: npm run mobile:android:release
        env:
          DRAWSKETCH_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          DRAWSKETCH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DRAWSKETCH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: signed-android
          if-no-files-found: error
          path: |
            release/*-signed.apk
            release/*.aab

  ios:
    needs: validate
    if: inputs.target == 'ios'
    environment: signed-distribution
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Apple signing material
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          EXPORT_OPTIONS: ${{ secrets.IOS_EXPORT_OPTIONS_BASE64 }}
        run: python3 scripts/ios-signing.py
      - run: npm run mobile:ios:device
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/drawsketch-signing.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: signed-ios
          if-no-files-found: error
          path: release/ios/*.ipa
